name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  GODOT_VERSION: 4.7.1

jobs:
  export-android:
    name: Android APK (debug)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Move export templates to expected path
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project resources
        run: godot --headless --verbose --import

      - name: Build Android APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/alnomas-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alnomas-android-debug
          path: build/android/alnomas-debug.apk

  export-web:
    name: Web (itch.io)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Move export templates to expected path
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project resources
        run: godot --headless --verbose --import

      - name: Build Web export
        run: |
          mkdir -v -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: alnomas-web
          path: build/web
